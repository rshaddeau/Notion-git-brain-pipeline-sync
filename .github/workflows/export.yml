name: Export from Notion

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Run export
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ROOT_PAGE_ID: ${{ secrets.NOTION_ROOT_PAGE_ID }}
        run: npm run export

      - name: Check for changes
        id: git_status
        run: |
          if [ -n "$(git status --porcelain -- content/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.git_status.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          git commit -m "Export from Notion: $(date -u +'%Y-%m-%d')"
          git push

      # This step exists because of a GitHub Actions anti-recursion rule:
      # a push made using the automatic GITHUB_TOKEN does NOT trigger other
      # workflows' `on: push` triggers (this is deliberate, to stop infinite
      # workflow chains). distribute.yml below still has `on: push` for
      # manual/other-triggered pushes, but the commit two steps up will
      # never fire it on its own - so we explicitly dispatch it here instead
      # of assuming the push trigger will pick it up.
      - name: Trigger distribution
        if: steps.git_status.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run distribute.yml --repo ${{ github.repository }} --ref main
